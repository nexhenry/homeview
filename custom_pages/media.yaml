# media.yaml — the TV: sources, a remote, and sound levels. Opened by holding the TV tile:
#   customize:
#     media_player.living_room_tv: { hold: media }
# Change the vars: block to your own entities (Developer tools → States), then double-tap the
# page title → Reload pages.
path: media
title: Media
icon: mdi:television
color: orange
subview: true

vars:
  tv: media_player.living_room_tv
  tv_remote: remote.living_room_tv          # a Samsung TV's remote (KEY_… commands)
  soundbar: media_player.soundbar
  speakers: [media_player.kitchen_speaker, media_player.bedroom_speaker]
  music_level: input_number.music_volume    # a level to slide (input_number or number)
  music_mute: input_boolean.music_muted     # optional: tap the fader's icon to mute

sections:
  # buttons as pills: tap runs `action` (with data / target) or toggles `toggle`; lit in `color`
  # while `watch` is `when` (or while `toggle` is on)
  - title: Watch
    icon: mdi:television-play
    width: half                              # two sections side by side on tablets
    layout: pills
    tiles:
      - { type: button, name: TV, icon: mdi:television, icon_off: mdi:television-off, color: green, toggle: $tv }
      - { type: button, name: Netflix, icon: mdi:netflix, color: red, watch: $tv, attribute: source, when: Netflix,
          action: media_player.select_source, target: $tv, data: { source: Netflix } }
      - { type: button, name: YouTube, icon: mdi:youtube, color: red, watch: $tv, attribute: source, when: YouTube,
          action: media_player.select_source, target: $tv, data: { source: YouTube } }
      - { entity: $soundbar, name: Soundbar }
  # a keypad: icon buttons in `columns` columns; '.' leaves a key empty. defaults: = what every key
  # has in common (a key's own settings win)
  - title: Remote
    icon: mdi:remote-tv
    width: half
    layout: keypad
    columns: 3
    defaults: { type: button, action: remote.send_command, target: $tv_remote }
    tiles:
      - { name: Power, icon: mdi:power, data: { command: KEY_POWER } }
      - { name: Up, icon: mdi:chevron-up, data: { command: KEY_UP } }
      - { name: Vol +, icon: mdi:volume-plus, data: { command: KEY_VOLUP } }
      - { name: Left, icon: mdi:chevron-left, data: { command: KEY_LEFT } }
      - { name: OK, icon: mdi:checkbox-blank-circle-outline, data: { command: KEY_ENTER } }
      - { name: Right, icon: mdi:chevron-right, data: { command: KEY_RIGHT } }
      - { name: Back, icon: mdi:arrow-u-left-top, data: { command: KEY_RETURN } }
      - { name: Down, icon: mdi:chevron-down, data: { command: KEY_DOWN } }
      - { name: Vol −, icon: mdi:volume-minus, data: { command: KEY_VOLDOWN } }
  - title: Speakers
    icon: mdi:speaker-multiple
    layout: pills
    tiles:
      - $speakers
  # faders: slide = the level; tap the icon = mute / unmute (MUTED while muted)
  - title: Levels
    icon: mdi:tune-vertical
    layout: faders
    tiles:
      - { type: fader, entity: $music_level, mute: $music_mute, name: Music, icon: mdi:music, color: green }
