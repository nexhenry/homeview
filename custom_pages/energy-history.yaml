# energy-history.yaml — the history from Home Assistant's Energy dashboard, as a HomeView page.
# Opened by holding the Energy pill:
#   pills: [alarm, climate, { pill: energy, hold: energy-history }, lights, locks, openings, safety, batteries, media]
# Nothing to change: it uses your Energy settings (Settings → Dashboards → Energy).
# Pick the day / week / month with the date bar at the top.
path: energy-history
title: Energy History
icon: mdi:chart-bar
color: amber
subview: true

sections:
  - tiles:
      - card: { type: energy-date-selection }
        size: full x auto
        phone_size: 2xauto
  - title: Usage
    tiles:
      - card: { type: energy-usage-graph }
        size: full x auto
        phone_size: 2xauto
      - card: { type: energy-distribution, link_dashboard: false }
        size: 2xauto
        phone_size: 2xauto
      - card: { type: energy-sources-table }
        size: 3xauto
        phone_size: 2xauto
  - title: Solar & devices
    tiles:
      - card: { type: energy-solar-graph }      # empty if you have no solar
        size: full x auto
        phone_size: 2xauto
      # the 10 biggest devices (bar or pie, sized to them); "All devices" lists every one, as bars
      # (a pie with dozens of slices can't be read, and the card sizes its pie by the device count)
      - card: { type: energy-devices-graph, max_devices: 10 }
        more: { max_devices: null, modes: [bar] }
        more_label: More ({energy_devices})        # how many devices the Energy settings track
        less_label: Top 10
        legend_more: false                         # no "More (4)" of the chart's own: More (41) shows them all
        size: full x auto
        phone_size: 2xauto
