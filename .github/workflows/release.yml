name: Release

# Push a version tag (git tag v0.2.0 && git push origin v0.2.0) and this creates the GitHub
# release HACS installs from: notes from that version's CHANGELOG.md section, homeview.js
# attached. The tag must match HV_VERSION in dist/homeview.js.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the version
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "const HV_VERSION = '$v';" dist/homeview.js || { echo "dist/homeview.js HV_VERSION is not $v"; exit 1; }
          node --check dist/homeview.js
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "HomeView $v" > notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" dist/homeview.js --clobber \
            || gh release create "$GITHUB_REF_NAME" dist/homeview.js --title "HomeView ${GITHUB_REF_NAME}" --notes-file notes.md
      - name: Tell reporters which version fixed their issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # issues named in "Fixes / Closes / Resolves #N" since the previous tag
          prev="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          range="${prev:+$prev..}$GITHUB_REF_NAME"
          nums="$(git log --format=%B "$range" | grep -ioE '(fix(es|ed)?|close[sd]?|resolve[sd]?) #[0-9]+' | grep -oE '[0-9]+' | sort -un || true)"
          for n in $nums; do
            gh issue comment "$n" --body "🎉 This is fixed in **HomeView ${GITHUB_REF_NAME}**. Update it in HACS (HACS → HomeView → Update), then reload the dashboard. If it still happens, just reply here and the issue will be looked at again." || true
            gh issue edit "$n" --remove-label fixed --remove-label confirmed --remove-label triage >/dev/null 2>&1 || true
          done
