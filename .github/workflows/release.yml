name: Release

on:
  release:
    types: [published]

jobs:
  attach:
    name: Attach homeview.js
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: gh release upload "${{ github.event.release.tag_name }}" dist/homeview.js --clobber
        env:
          GH_TOKEN: ${{ github.token }}
